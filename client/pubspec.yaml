name: wisplit_client
description: "Core Flutter client for WiSplit expense splitting, debt simplification, and offline-first personal ledger."
publish_to: "none"
version: 1.0.9+9

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  file_picker: ^8.0.0
  excel: ^4.0.6
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
  assets:
    - assets/images/wisplit_logo.png
